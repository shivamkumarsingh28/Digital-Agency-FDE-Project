<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saiam Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --fog:#e8eef0; --paper:#ffffff; --ink:#10232e; --ink-2:#4a5d68; --line:#d3dde1;
  --saffron:#f2a71b; --saffron-ink:#3b2700; --teal:#0e7c7b; --teal-bg:#e3f2f1; --warn:#a4410f; --warn-bg:#fbeadf;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--fog:#0c1820; --paper:#14272f; --ink:#e6eef1; --ink-2:#97aab3; --line:#264049;
        --teal:#4fd1c5; --teal-bg:#12343a; --warn:#f0a070; --warn-bg:#3a2316; --saffron-ink:#2a1c00}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fog);color:var(--ink);font:15px/1.55 var(--body)}
.app{display:grid;grid-template-columns:300px 1fr;height:100%;max-width:1180px;margin:0 auto}
aside{padding:28px 22px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{font:700 26px/1.05 var(--display);letter-spacing:-.02em}
.brand small{display:block;font:500 13px var(--body);color:var(--ink-2);margin-top:6px;letter-spacing:0}
h2{font:700 13px var(--body);margin:0 0 8px;color:var(--ink-2)}
.persona{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:inherit;
  border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;font:inherit}
.persona b{display:block;font-weight:600}
.persona span{font-size:12.5px;color:var(--ink-2)}
.persona[aria-pressed=true]{background:var(--paper);border-color:var(--ink);box-shadow:inset 3px 0 0 var(--saffron)}
.prompt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:9px 2px;color:var(--ink);cursor:pointer;font:inherit}
.prompt:hover{color:var(--teal)}
main{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line)}
header.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
header.bar button{background:none;border:1px solid var(--line);border-radius:8px;color:inherit;padding:5px 10px;cursor:pointer;font:inherit}
#log{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.empty{margin:auto;max-width:420px;text-align:center;color:var(--ink-2)}
.empty h1{font:700 30px/1.1 var(--display);color:var(--ink);margin:0 0 10px;letter-spacing:-.02em}
.msg{max-width:min(640px,92%);white-space:normal;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:16px 16px 4px 16px}
.msg.bot{align-self:flex-start}
.msg .text{background:var(--fog);padding:11px 15px;border-radius:16px 16px 16px 4px}
.msg .text ul{margin:6px 0;padding-left:20px}
.msg .text a{color:var(--teal)}
.msg .text.warn{background:var(--warn-bg);color:var(--warn)}
.cursor::after{content:"";display:inline-block;width:7px;height:1em;background:var(--saffron);margin-left:2px;vertical-align:-2px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}
details.trace{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
details.trace summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;padding:2px 0}
details.trace summary::-webkit-details-marker{display:none}
.trace ol{margin:6px 0 0;padding:0;list-style:none;border-left:2px solid var(--line)}
.trace li{padding:3px 0 3px 12px;position:relative}
.trace li::before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.trace li.denied::before,.trace li.guard::before{background:var(--warn)}
.trace code{background:var(--teal-bg);color:var(--teal);padding:1px 6px;border-radius:5px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2)}
.chip.tenant{border-color:var(--saffron);color:var(--ink)}
form{display:flex;gap:10px;padding:14px 24px 20px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:var(--paper);color:var(--ink);max-height:140px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
form button{background:var(--saffron);color:var(--saffron-ink);border:0;border-radius:12px;padding:0 20px;font:600 15px var(--body);cursor:pointer}
form button:disabled{opacity:.5;cursor:default}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{padding:14px 16px;flex-direction:row;overflow-x:auto;gap:12px}
  .brand small,.prompts,h2{display:none}.persona{min-width:170px;margin:0}
  main{border:0}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Saiam Assistant<small>Multi-agent concierge for Saiam Digital Agency</small></div>
    <section><h2>Sign in as</h2><div id="personas"></div></section>
    <section class="prompts"><h2>Try asking</h2><div id="prompts"></div></section>
  </aside>
  <main>
    <header class="bar"><span id="who"></span><button id="new" type="button">New chat</button></header>
    <div id="log" aria-live="polite"></div>
    <form id="f">
      <textarea id="q" rows="1" maxlength="2000" placeholder="Ask about services, projects or invoices" aria-label="Message"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const AGENT = {faq_specialist:"FAQ & Knowledge", project_specialist:"Project status", billing_specialist:"Billing",
  escalation_specialist:"Lead & escalation", integrations_specialist:"Integrations (MCP)", respond_direct:"Direct reply"};
const session = Math.random().toString(36).slice(2, 10);
let personas = [], persona = "visitor", threadId = null, busy = false;

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(t){
  const lines = esc(t).split("\n"); let out = "", list = false;
  for (const l of lines){
    const m = l.match(/^\s*[-*]\s+(.*)/);
    if (m){ if(!list){out += "<ul>"; list = true} out += "<li>"+inline(m[1])+"</li>"; }
    else { if(list){out += "</ul>"; list = false} out += (l.trim() ? inline(l) : "") + (l.trim() ? "<br>" : ""); }
  }
  return out + (list ? "</ul>" : "");
}
const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

async function init(){
  personas = await (await fetch("/api/v1/demo/personas")).json();
  renderPersonas(); reset();
}
function renderPersonas(){
  $("#personas").innerHTML = "";
  for (const p of personas){
    const b = document.createElement("button");
    b.className = "persona"; b.type = "button"; b.setAttribute("aria-pressed", p.id === persona);
    b.innerHTML = `<b>${p.label}</b><span>${p.blurb}</span>`;
    b.onclick = () => { persona = p.id; renderPersonas(); reset(); };
    $("#personas").append(b);
  }
  const cur = personas.find(p => p.id === persona);
  $("#who").textContent = cur ? `${cur.label} · role ${cur.role}` : "";
  $("#prompts").innerHTML = "";
  for (const t of (cur?.prompts || [])){
    const b = document.createElement("button");
    b.className = "prompt"; b.type = "button"; b.textContent = t; b.onclick = () => send(t);
    $("#prompts").append(b);
  }
}
function reset(){
  threadId = null; $("#log").innerHTML =
   `<div class="empty"><h1>How can we help?</h1><p>Ask about our services, check a project, or request a proposal. Each answer shows which agent and tools handled it.</p></div>`;
  renderPersonas();
}
function addMsg(cls, html){
  $("#log").querySelector(".empty")?.remove();
  const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html;
  $("#log").append(d); $("#log").scrollTop = 1e9; return d;
}

async function send(text){
  text = (text ?? $("#q").value).trim(); if (!text || busy) return;
  busy = true; $("#send").disabled = true; $("#q").value = "";
  addMsg("user", esc(text));
  const bot = addMsg("bot", `<div class="text cursor"></div><details class="trace" open><summary>Agent activity</summary><ol></ol></details><div class="chips"></div>`);
  const tEl = bot.querySelector(".text"), ol = bot.querySelector("ol"), chips = bot.querySelector(".chips");
  let answer = "";
  const step = (html, cls="") => { const li = document.createElement("li"); li.className = cls; li.innerHTML = html; ol.append(li); };
  try {
    const res = await fetch("/api/v1/demo/chat/stream", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text, thread_id:threadId, persona, session_id:session})});
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || "Request failed");
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for(;;){
      const {value, done} = await reader.read(); if (done) break;
      buf += value; const frames = buf.split("\n\n"); buf = frames.pop();
      for (const fr of frames){
        if (!fr.startsWith("data: ")) continue;
        const raw = fr.slice(6).trim(); if (raw === "[DONE]") continue;
        const ev = JSON.parse(raw);
        if (ev.type === "thread") threadId = ev.thread_id;
        else if (ev.type === "route") step(ev.denied ? `Supervisor routed to <b>${AGENT[ev.agent]||ev.agent}</b>, blocked by role policy` :
            `Supervisor → <b>${AGENT[ev.agent]||ev.agent}</b> <span>(${esc(ev.rationale||"")})</span>`, ev.denied ? "denied" : "");
        else if (ev.type === "tool" && ev.status === "done") step(`Tool <code>${ev.name}</code> ${esc((ev.preview||"").split("\n")[0].slice(0,90))}`);
        else if (ev.type === "guard") step(ev.action === "blocked" ? "Input guardrail blocked this message" :
            ev.action === "no_grounding" ? "Output guardrail: no grounded source, safe fallback used" : "Output guardrail: answer not faithful to sources, fallback used", "guard");
        else if (ev.type === "sources") for (const s of ev.items) {
            const c = document.createElement("span"); c.className = "chip " + s.scope;
            c.title = s.excerpt; c.textContent = `${s.title} › ${s.heading}` + (s.scope === "tenant" ? " (private)" : ""); chips.append(c); }
        else if (ev.type === "token"){ answer += ev.text; tEl.innerHTML = md(answer); $("#log").scrollTop = 1e9; }
        else if (ev.type === "error") { answer = ev.message; tEl.classList.add("warn"); tEl.textContent = answer; }
      }
    }
  } catch (e){ tEl.classList.add("warn"); tEl.textContent = "Sorry, I couldn't reach the assistant. " + e.message; }
  tEl.classList.remove("cursor"); bot.querySelector("details").open = false;
  if (!ol.children.length) bot.querySelector("details").remove();
  busy = false; $("#send").disabled = false; $("#q").focus();
}
$("#f").addEventListener("submit", e => { e.preventDefault(); send(); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
$("#new").onclick = reset;
init();
</script>
</body>
</html>
